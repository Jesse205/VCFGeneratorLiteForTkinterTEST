name: Screenshots

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 要跑的平台（macOS 调试时选 macos，避免浪费 Linux runner）
        type: choice
        options: [all, linux, macos]
        default: all
      macos_runner:
        description: macOS runner 标签（容量波动时换池重试）
        required: false
        default: macos-15-intel
        type: string

permissions:
  contents: read

jobs:
  linux:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-latest
    env:
      UV_NO_DEFAULT_GROUPS: true
      # uv 独立 Python 自带的 Tk 9 无 Xft/fontconfig，无法使用 Noto 字体；改用系统 Tk 8.6。
      UV_PYTHON: /usr/bin/python3
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xfwm4 xfconf dbus x11-utils x11-xserver-utils \
            fonts-noto-core fonts-noto-cjk locales python3-tk xfwm4-theme-breeze arc-theme \
            imagemagick cmake tk-dev tcl-dev unzip
      - name: Generate locales
        run: sudo locale-gen zh_CN.UTF-8 en_US.UTF-8
      - name: Create environment with system Tk
        run: |
          uv venv --python /usr/bin/python3 --system-site-packages
          uv sync --group screenshot
      - name: Build tksvg (svg ttk themes need it; no cp312 wheel)
        run: |
          uv pip install --python .venv/bin/python scikit-build
          uv pip install --python .venv/bin/python --no-build-isolation tksvg
      - name: Prepare theme assets
        run: bash scripts/screenshot_linux_prepare.sh
      - name: Take screenshots (all combos)
        run: bash scripts/screenshot_linux_combos.sh screenshots/linux
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-linux
          path: screenshots/linux

  macos:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: ${{ inputs.macos_runner || 'macos-15-intel' }}
    env:
      UV_NO_DEFAULT_GROUPS: true
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.12"
      - name: Install open-source fonts
        run: brew install --cask font-noto-sans font-noto-sans-cjk-sc
      - name: Probe display scaling
        run: swift scripts/screenshot_macos_display.swift
      - name: Set HiDPI 2x natively
        id: native_hidpi
        continue-on-error: true
        run: swift scripts/screenshot_macos_display.swift set
      - name: Fallback to BetterDisplay virtual HiDPI screen
        if: steps.native_hidpi.outcome != 'success'
        run: |
          brew install --cask betterdisplay
          open /Applications/BetterDisplay.app
          sleep 8
          CLI=/Applications/BetterDisplay.app/Contents/MacOS/BetterDisplay
          "$CLI" create -type=VirtualScreen -virtualScreenName=ShotDisplay \
            -virtualScreenHiDPI=on -useResolutionList=on -resolutionList=1920x1080
          sleep 3
          "$CLI" set -name=ShotDisplay -resolution=1920x1080 -hiDPI=on
          "$CLI" set -name=ShotDisplay -main=on
          sleep 3
          swift scripts/screenshot_macos_display.swift
      - name: Take screenshots
        run: |
          uv run --group screenshot python -m scripts.screenshot \
            --platform macos --output-dir screenshots/macos
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos
          path: screenshots/macos