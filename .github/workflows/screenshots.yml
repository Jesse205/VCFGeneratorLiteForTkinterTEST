name: Screenshots

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 要跑的平台（调试单个平台可避免浪费其它 runner）
        type: choice
        options: [all, linux, macos] # windows 暂停：虚拟显示器不支持 200% 缩放
        default: all
      macos_runner:
        description: macOS runner 标签（容量波动时换池重试）
        required: false
        default: macos-15-intel
        type: string

permissions:
  contents: read

jobs:
  linux:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' }}
    # 固定 24.04：系统 python3.12 + cmake3，与 WSL 验证环境一致（26.04 的 cmake4 拒编 tksvg）。
    runs-on: ubuntu-24.04
    env:
      UV_NO_DEFAULT_GROUPS: true
      # uv 独立 Python 自带的 Tk 9 无 Xft/fontconfig，无法使用 Noto 字体；改用系统 Tk 8.6。
      UV_PYTHON: /usr/bin/python3
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xfwm4 xfconf dbus x11-utils x11-xserver-utils \
            fonts-noto-core fonts-noto-cjk locales python3-tk arc-theme \
            imagemagick cmake tk-dev tcl-dev unzip
      - name: Generate locales
        run: sudo locale-gen zh_CN.UTF-8 en_US.UTF-8
      - name: Create environment with system Tk
        run: |
          uv venv --python /usr/bin/python3 --system-site-packages
          uv sync --group screenshot
      - name: Build tksvg (svg ttk themes need it; no cp312 wheel)
        run: |
          uv pip install --python .venv/bin/python scikit-build
          uv pip install --python .venv/bin/python --no-build-isolation tksvg
      - name: Prepare theme assets
        run: bash scripts/screenshot_linux_prepare.sh
      - name: Take screenshots (all combos)
        run: bash scripts/screenshot_linux_combos.sh screenshots/linux
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-linux
          path: screenshots/linux

  macos:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: ${{ inputs.macos_runner || 'macos-15-intel' }}
    env:
      UV_NO_DEFAULT_GROUPS: true
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.12"
      - name: Install open-source fonts
        run: brew install --cask font-noto-sans font-noto-sans-cjk-sc
      - name: Probe display scaling
        run: swift scripts/screenshot_macos_display.swift
      - name: Set HiDPI 2x natively
        id: native_hidpi
        continue-on-error: true
        run: swift scripts/screenshot_macos_display.swift set
      - name: Fallback to BetterDisplay virtual HiDPI screen
        if: steps.native_hidpi.outcome != 'success'
        run: |
          set -x
          # --no-quarantine：headless 环境无人点 Gatekeeper 确认框，带隔离属性的 app 会让 open 永久挂起。
          # 新版 brew 不再接受命令行旗标，改用 HOMEBREW_CASK_OPTS；失败则普通安装，事后 xattr 清隔离。
          HOMEBREW_CASK_OPTS="--no-quarantine" brew install --cask betterdisplay || \
            brew install --cask betterdisplay || true
          xattr -dr com.apple.quarantine /Applications/BetterDisplay.app 2>/dev/null || true
          CLI=/usr/local/bin/betterdisplaycli
          # macOS 无 timeout；用 perl alarm 限每命令时长，避免等待应用就绪时无限挂起。
          run_limited() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          # -g -j 不置前/不激活；即便仍被阻塞也有超时兜底，不挂死整个 job。
          run_limited 30 open -g -j /Applications/BetterDisplay.app || true
          for i in $(seq 1 30); do
            if run_limited 10 "$CLI" get -identifiers >/tmp/bd-ready.json 2>/tmp/bd-ready.err; then
              echo "betterdisplay ready after ${i} probes"
              break
            fi
            sleep 2
          done
          cat /tmp/bd-ready.json || true
          # 创建虚拟 HiDPI 屏；CLI 可能静默失败，后续靠轮询确认。
          run_limited 60 "$CLI" create -type=VirtualScreen -virtualScreenName=ShotDisplay \
            -virtualScreenHiDPI=on || true
          # 轮询确认虚拟屏已出现（最长约 60s），未出现则降级 1x 继续。
          ready=""
          for i in $(seq 1 30); do
            if run_limited 10 "$CLI" get -identifiers 2>/dev/null | grep -q ShotDisplay; then
              ready=1
              echo "ShotDisplay visible after ${i} polls"
              break
            fi
            sleep 2
          done
          [ -n "$ready" ] || echo "WARN: ShotDisplay 未出现，后续以 1x 截图"
          # 诊断：完整 identifiers 与系统扩展状态（判断虚拟屏驱动是否真正挂载）。
          run_limited 10 "$CLI" get -identifiers > /tmp/bd-after.json || true
          cat /tmp/bd-after.json || true
          systemextensionsctl list || true
          sleep 3
          # set 各命令容错：任一失败不影响后续（最终状态以 swift 探测为准）。
          run_limited 30 "$CLI" set -name=ShotDisplay -resolution=1920x1080 -hiDPI=on || true
          run_limited 30 "$CLI" set -name=ShotDisplay -main=on || true
          sleep 3
          swift scripts/screenshot_macos_display.swift
      - name: Take screenshots
        run: |
          # 托管 runner 无 HiDPI 可用：原生无 2x 模式；BetterDisplay 虚拟屏驱动（DriverKit）
          # 需 GUI 批准，headless 下 displayID=0/UUID=UNKNOWN 无法挂载，set 全部失败。
          # 2x 截图需本机 Retina Mac 或自托管 runner；此处降级 1x。
          uv run --group screenshot python -m scripts.screenshot \
            --platform macos --output-dir screenshots/macos --scale 1
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos
          path: screenshots/macos
  windows:
    # 暂停：CI 虚拟显示器仅支持 100%~125% 缩放，无法应用 200% 系统级 DPI（脚本已具备，恢复时改回下方条件）。
    if: false # ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    env:
      UV_NO_DEFAULT_GROUPS: true
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.12"
      - name: Download Noto Sans fonts
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fonts"
          for weight in Regular Bold Italic BoldItalic; do
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSans/NotoSans-${weight}.ttf" \
              -o "$RUNNER_TEMP/fonts/NotoSans-${weight}.ttf"
          done
          for weight in Regular Bold; do
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-${weight}.otf" \
              -o "$RUNNER_TEMP/fonts/NotoSansCJKsc-${weight}.otf"
          done
      - name: Take screenshots
        shell: bash
        run: |
          uv run --group screenshot python -m scripts.screenshot \
            --platform windows --output-dir screenshots/windows \
            --scale 2 --font-dir "$RUNNER_TEMP/fonts"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: screenshots/windows
