name: Screenshots

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 要跑的平台（调试单个平台可避免浪费其它 runner）
        type: choice
        options: [all, linux, macos] # windows 暂停：虚拟显示器不支持 200% 缩放
        default: all
      macos_runner:
        description: macOS runner 标签（容量波动时换池重试）
        required: false
        default: macos-15-intel
        type: string

permissions:
  contents: read

jobs:
  linux:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' }}
    # 固定 24.04：系统 python3.12 + cmake3，与 WSL 验证环境一致（26.04 的 cmake4 拒编 tksvg）。
    runs-on: ubuntu-24.04
    env:
      UV_NO_DEFAULT_GROUPS: true
      # uv 独立 Python 自带的 Tk 9 无 Xft/fontconfig，无法使用 Noto 字体；改用系统 Tk 8.6。
      UV_PYTHON: /usr/bin/python3
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xfwm4 xfconf dbus x11-utils x11-xserver-utils \
            fonts-noto-core fonts-noto-cjk locales python3-tk arc-theme \
            imagemagick cmake tk-dev tcl-dev unzip
      - name: Generate locales
        run: sudo locale-gen zh_CN.UTF-8 en_US.UTF-8
      - name: Create environment with system Tk
        run: |
          uv venv --python /usr/bin/python3 --system-site-packages
          uv sync --group screenshot
      - name: Build tksvg (svg ttk themes need it; no cp312 wheel)
        run: |
          uv pip install --python .venv/bin/python scikit-build
          uv pip install --python .venv/bin/python --no-build-isolation tksvg
      - name: Prepare theme assets
        run: bash scripts/screenshot_linux_prepare.sh
      - name: Take screenshots (all combos)
        run: bash scripts/screenshot_linux_combos.sh screenshots/linux
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-linux
          path: screenshots/linux

  macos:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: ${{ inputs.macos_runner || 'macos-15-intel' }}
    env:
      UV_NO_DEFAULT_GROUPS: true
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.12"
      - name: Install open-source fonts
        run: brew install --cask font-noto-sans font-noto-sans-cjk-sc
      - name: Probe display scaling
        run: swift scripts/screenshot_macos_display.swift
      # 托管 runner 无 HiDPI 可用：原生无 2x 模式；BetterDisplay 虚拟屏驱动（DriverKit）需 GUI
      # 批准，headless 下 displayID=0/UUID=UNKNOWN 无法挂载，set 全部失败（此前多轮已实测）。
      # 2x 截图需自托管 runner 或租用真 Mac；此处固定 1x。
      - name: Take screenshots
        run: |
          uv run --group screenshot python -m scripts.screenshot \
            --platform macos --output-dir screenshots/macos --scale 1
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos
          path: screenshots/macos
  windows:
    # 暂停：CI 虚拟显示器仅支持 100%~125% 缩放，无法应用 200% 系统级 DPI（脚本已具备，恢复时改回下方条件）。
    if: false # ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    env:
      UV_NO_DEFAULT_GROUPS: true
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.12"
      - name: Download Noto Sans fonts
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fonts"
          for weight in Regular Bold Italic BoldItalic; do
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSans/NotoSans-${weight}.ttf" \
              -o "$RUNNER_TEMP/fonts/NotoSans-${weight}.ttf"
          done
          for weight in Regular Bold; do
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-${weight}.otf" \
              -o "$RUNNER_TEMP/fonts/NotoSansCJKsc-${weight}.otf"
          done
      - name: Take screenshots
        shell: bash
        run: |
          uv run --group screenshot python -m scripts.screenshot \
            --platform windows --output-dir screenshots/windows \
            --scale 2 --font-dir "$RUNNER_TEMP/fonts"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: screenshots/windows
